services:
  frontend:
    build:
      context: ./client
    env_file:
      - ./client/.env.development
    # These addresses are used by the browser; the local backend serves HTTP.
    environment:
      VITE_API_URL: http://localhost:5001
      VITE_SOCKET_URL: http://localhost:5001
      VITE_ASSET_BASE_URL: http://localhost:5001
    ports:
      - "5173:5173"
    depends_on:
      - backend

  backend:
    build:
      context: ./server
    env_file:
      - ./server/.env
      # Shared translation key; keep this last so both services use the same value.
      - ./ai-service/.env
    environment:
      NODE_ENV: development
      PORT: "5001"
      CLIENT_ORIGINS: http://localhost:5173
      TRANSLATION_AI_URL: http://ai:8001
    ports:
      - "5001:5001"
    depends_on:
      - ai
    # environment:
    #   MONGO_URI: ${MONGODB_CONNECTIONSTRING}
    # depends_on:
    #   - mongo

  ai:
    build:
      context: ./ai-service
    env_file:
      - ./ai-service/.env
    environment:
      WHISPER_CPP_URL: http://whisper:8080
      QWEN_URL: http://qwen:8080
    tmpfs:
      - /tmp:size=32m,mode=1777
    depends_on:
      whisper:
        condition: service_healthy
      qwen:
        condition: service_started
    ports:
      - "127.0.0.1:8001:8001"
    restart: unless-stopped

  qwen:
    image: ghcr.io/ggml-org/llama.cpp@sha256:6257697a7f5d034b8fb499ddb07af3e250506352f94102054252a23f3b85e0af
    command: ["-hf", "Qwen/Qwen3-1.7B-GGUF:Q8_0", "--host", "0.0.0.0", "--port", "8080", "-c", "1024", "-np", "1", "-t", "4"]
    environment:
      LLAMA_CACHE: /models
    volumes:
      - qwen-model-cache:/models
    restart: unless-stopped

  whisper:
    image: qtmshrimple-whisper-cpu
    build:
      context: ./ai-service/whisper
      dockerfile: Dockerfile
    volumes:
      - whisper-model-cache:/models
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 120
    restart: unless-stopped

volumes:
  qwen-model-cache:
  whisper-model-cache:
